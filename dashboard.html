<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Critism's Voucher</title>

<link rel="stylesheet" href="styledashboard.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>📊 Dashboard</h1>
        <p>Manage your servers & voucher system</p>
    </div>

    <!-- SERVER SELECT -->
    <div class="card">
        <h2>🏠 Select Server</h2>

        <select class="select">
            <option>My Discord Server</option>
            <option>Test Server</option>
            <option>Community Server</option>
        </select>
    </div>

    <!-- STATS -->
    <div class="grid">

        <div class="stat">
            <h3>1,245</h3>
            <p>Total Vouches</p>
        </div>

        <div class="stat">
            <h3>320</h3>
            <p>Active Users</p>
        </div>

        <div class="stat">
            <h3>12</h3>
            <p>Servers</p>
        </div>

        <div class="stat">
            <h3>99.9%</h3>
            <p>Uptime</p>
        </div>

    </div>

    <!-- SETTINGS -->
    <div class="card">
        <h2>⚙️ Settings</h2>

        <div class="setting">
            <p>Voucher Logging</p>
            <label class="switch">
                <input type="checkbox" checked>
                <span></span>
            </label>
        </div>

        <div class="setting">
            <p>Auto Messages</p>
            <label class="switch">
                <input type="checkbox">
                <span></span>
            </label>
        </div>

    </div>

</div>

</body>
</html>
